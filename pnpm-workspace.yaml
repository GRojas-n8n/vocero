allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Triaje de Dependabot 2026-09-17 (ver memory/feedback-dependabot-triage.md):
# fija transitivos vulnerables a su primera versión parchada. postcss/nanoid/
# js-yaml/browserslist son build-time, nunca corren en el standalone de
# producción; sharp SÍ va aquí (revisado 2026-09-18): next@15.5.25 declara
# "sharp": "^0.34.3 || ^0.35.4" en sus propias optionalDependencies, así que
# 0.35.4 no es una versión ajena forzada — es la que Next ya soporta, solo
# que pnpm había resuelto la rama 0.34.x por ser la que ya estaba en el
# lockfile. El binario sigue sin invocarse en runtime (no hay next/image en
# el repo) — este fix es preventivo, no corrige una explotación real.
overrides:
  nanoid@<3.3.18: "^3.3.18"
  js-yaml@<4.3.2: "^4.3.2"
  browserslist@<4.28.7: "^4.28.7"
  baseline-browser-mapping@<2.11.0: "^2.11.0"
  postcss@<8.5.23: "^8.5.23"
  sharp@<0.35.4: "^0.35.4"
